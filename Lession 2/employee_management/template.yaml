AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  The project crud with database

Parameters:
  DbHost:
    Type: String
    Default: "192.168.1.84"
    Description: Endpoint cua Postgres (vi du RDS endpoint)
  DbPort:
    Type: String
    Default: "5432"
  DbUser:
    Type: String
    Default: "postgres"
  DbPassword:
    Type: String
    Default: "postgres"
    NoEcho: true
  DbName:
    Type: String
    Default: employee_management
  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Subnet trong cung VPC voi RDS (bat buoc de Lambda ket noi duoc Postgres)
  VpcSecurityGroupIds:
    Type: CommaDelimitedList

Globals:
  Function:
    Runtime: python3.11
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        DB_NAME: !Ref DbName
        DB_POOL_SIZE: "2" # nho, vi moi container Lambda co pool rieng
        DB_MAX_OVERFLOW: "0"
        DB_POOL_RECYCLE: "280"
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true

Resources:
  Layers:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: layers
      Description: Shared Router + Response helper dung chung cho cac function
      ContentUri: layers/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.11

  EmployeesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: employees-function
      CodeUri: functions/employees/
      Handler: app.lambda_handler
      Layers:
        - !Ref Layers
      Events:
        GetAllEmployees:
          Type: Api
          Properties:
            Path: /api/v1/employees
            Method: get
        GetEmployeeByUuid:
          Type: Api
          Properties:
            Path: /api/v1/employees/{employee_uuid}
            Method: get
        InsertEmployee:
          Type: Api
          Properties:
            Path: /api/v1/employees/insert
            Method: post
        UpdateEmployee:
          Type: Api
          Properties:
            Path: /api/v1/employees/update
            Method: put
        DeleteEmployeeByUuid:
          Type: Api
          Properties:
            Path: /api/v1/employees/{employee_uuid}
            Method: delete
